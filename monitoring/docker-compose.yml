# Local observability demo: worker (dry-run) + Prometheus + Grafana.
#
#   cd monitoring
#   docker compose up --build
#
#   worker      http://localhost:8080   (POST test jobs with send_test_job.py)
#   Prometheus  http://localhost:9090
#   Grafana     http://localhost:3000   (anonymous admin, no login)
#
# The worker runs with DRY_RUN=true: it clones the target repo and runs the
# full pipeline, but the LLM returns a deterministic stub — no cloud calls,
# no credentials, no cost.
services:
  analysis-worker:
    build:
      context: ..
      dockerfile: services/analysis_worker/Dockerfile
    environment:
      DRY_RUN: "true"
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
